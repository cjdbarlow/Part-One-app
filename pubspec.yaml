name: part_one
description: The Part One app for offline reading and search.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  provider: 6.1.5+1
  shared_preferences: 2.5.4
  webview_flutter: 4.13.1
  path_provider: 2.1.5
  html: 0.15.6
  archive: 4.0.9
  http: 1.6.0
  path: 1.9.1
  crypto: 3.0.7
  url_launcher: 6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: false
  assets:
    - assets/config/app.json
    - assets/reader/
